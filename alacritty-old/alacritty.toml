[terminal]
osc52 =  "CopyPaste"

[env]
TERM = "screen-256color"

[window]
#focus_reporting = false
#padding = { x = 15, y = 15 }
dimensions = { columns = 120, lines = 40 }
dynamic_padding = false
decorations =  "Buttonless"
opacity = 0.98

[scrolling] 
history = 10000
multiplier = 3

[selection]
save_to_clipboard = false

[keyboard]
bindings = [
    { key = "F11", action = "ToggleFullscreen" },
    { key  = "K", mods="Control|Shift", action = "ScrollPageUp" },
    { key  = "J", mods = "Control|Shift", action = "ScrollPageDown" },
]

#[font]
#size = 15
#offset = { x = 5, y = 2}
#normal = { family = "JetBrainsMono Nerd Font Mono", style = "Normal" }
#bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
#italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }


#[font]
#size = 15
#offset = { x = 5, y = 2}
#normal = { family = "MonoSpace", style = "Normal" }
#bold = { family = "MonoSpace", style = "Bold" }
#italic = { family = "MonoSpace", style = "Italic" }
#builtin_box_drawing = false

[colors.primary]
background = '#1c2023'
foreground = '#c7ccd1'

[colors.cursor]
text = '#1c2023'
cursor = '#c7ccd1'

[colors.normal]
black   = '#1c2023'
red     = '#c7ae95'
green   = '#95c7ae'
yellow  = '#aec795'
blue    = '#ae95c7'
magenta = '#c795ae'
cyan    = '#95aec7'
white   = '#c7ccd1'

[colors.bright]
black   = '#747c84'
red     = '#c7ae95'
green   = '#95c7ae'
yellow  = '#aec795'
blue    = '#ae95c7'
magenta = '#c795ae'
cyan    = '#95aec7'
white   = '#f3f4f5'


